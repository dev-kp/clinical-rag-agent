name: Evaluation matrix

# Manual dispatch only: this hits Azure OpenAI / Azure AI Search and costs real
# (small) money, so it never runs automatically on push or PR.
on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Comma-separated config ids to run (default: all)"
        required: false
        default: "all"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,eval]"

      - name: Run evaluation matrix
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
        run: python eval/run_eval.py --configs "${{ github.event.inputs.configs }}"

      - name: Generate report
        run: python eval/report.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/results README.md
          git diff --cached --quiet || git commit -m "chore: update eval results"
          git push
